
services:
  - type: web
    name: frontend
    runtime: docker
    rootDir: ./frontend
    plan: free
    envVars:
      - key: PORT
        value: 8080

  - type: web
    name: backend
    runtime: docker
    rootDir: ./backend
    plan: free
    envVars:
      - key: PORT
        value: 3000

      - key: DATABASE_URL
        value: file:./dev.db

      - key: USE_REDIS
        value: "false"

      - key: CURRENTS_API_KEY
        sync: false
